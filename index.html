<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌹 Your Rose Garden 🌹</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .rose-text { font-family: 'Dancing Script', cursive; }
        .body-text { font-family: 'Playfair Display', serif; }
        .glass-panel {
            background: rgba(20, 10, 10, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 100, 100, 0.25);
            box-shadow: 0 8px 32px rgba(139, 0, 0, 0.4);
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(255, 50, 50, 0.6), 0 0 40px rgba(255, 0, 0, 0.3);
        }
        .petal-btn {
            background: linear-gradient(135deg, #8b0000, #dc143c);
            border: none;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .petal-btn:active {
            transform: scale(0.95);
        }
        .petal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(220, 20, 60, 0.6);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .floating { animation: float 4s ease-in-out infinite; }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .pulse-glow { animation: pulse-glow 3s ease-in-out infinite; }
        .fade-in { animation: fadeIn 2s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a; z-index: 100; display: flex;
            align-items: center; justify-content: center; flex-direction: column;
            transition: opacity 1s ease;
        }
        .heart-loader {
            width: 50px; height: 50px;
            background: #dc143c;
            position: relative;
            transform: rotate(-45deg);
            animation: heartbeat 1.2s ease-in-out infinite;
        }
        .heart-loader::before, .heart-loader::after {
            content: ''; width: 50px; height: 50px;
            background: #dc143c; border-radius: 50%;
            position: absolute;
        }
        .heart-loader::before { top: -25px; left: 0; }
        .heart-loader::after { left: 25px; top: 0; }
        @keyframes heartbeat {
            0%, 100% { transform: rotate(-45deg) scale(1); }
            50% { transform: rotate(-45deg) scale(1.1); }
        }
        @media (max-width: 768px) {
            .mobile-title { font-size: 2.5rem !important; }
            .mobile-subtitle { font-size: 0.9rem !important; }
            .mobile-controls { flex-direction: column !important; gap: 0.5rem !important; }
            .mobile-btn { padding: 0.5rem 1rem !important; font-size: 0.75rem !important; }
            .mobile-panel { max-width: 90vw !important; padding: 1rem !important; }
            .mobile-msg-title { font-size: 1.5rem !important; }
            .mobile-msg-text { font-size: 0.9rem !important; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading" style="cursor:pointer;">
        <div class="heart-loader"></div>
        <p class="rose-text text-xl text-red-400 mt-6">Planting roses for you...</p>
        <p id="tap-hint" class="rose-text text-sm text-red-300 mt-6 pulse-glow" style="opacity:0; transition: opacity 1s ease;">
            ✨ Tap anywhere to enter ✨
        </p>
    </div>

    <!-- Background Music -->
    <audio id="bg-music" loop preload="auto">
        <source src="Lord%20Huron%20-%20The%20Night%20We%20Met%20(Official%20Audio).mp3" type="audio/mpeg">
    </audio>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div class="ui-layer w-full h-screen flex flex-col justify-between p-4 md:p-6">
        <!-- Header -->
        <div class="text-center fade-in">
            <h1 class="rose-text text-4xl md:text-7xl text-red-400 glow-text floating mobile-title">
                Your Rose Garden
            </h1>
            <p class="body-text text-red-200/80 text-base md:text-lg mt-2 italic mobile-subtitle">
                "My way of apology..."
            </p>
        </div>

        <!-- Center Message Panel -->
        <div id="message-panel" class="hidden interactive glass-panel rounded-2xl p-4 md:p-6 max-w-sm md:max-w-md mx-auto text-center fade-in mobile-panel" style="pointer-events: auto;">
            <h2 class="rose-text text-2xl md:text-3xl text-red-300 mb-2 md:mb-3 mobile-msg-title">Sorry</h2>
            <p class="body-text text-red-100/90 text-sm md:text-base leading-relaxed mobile-msg-text">I'm truly sorry.</p>
            <button id="close-btn" class="mt-3 md:mt-4 petal-btn text-white px-5 md:px-6 py-2 rounded-full text-xs md:text-sm tracking-wide mobile-btn" style="pointer-events: auto; cursor: pointer;">
                Close
            </button>
        </div>

        <!-- Bottom Controls -->
        <div class="flex flex-col md:flex-row justify-between items-end gap-3 md:gap-4 fade-in mobile-controls">
            <div class="glass-panel rounded-xl p-3 md:p-4 interactive w-full md:w-auto mobile-panel" style="pointer-events: auto;">
                <p class="body-text text-red-200/70 text-xs mb-2">Controls</p>
                <div class="flex gap-2 flex-wrap justify-center md:justify-start">
                    <button id="reset-btn" class="petal-btn text-white px-3 md:px-4 py-1.5 rounded-lg text-xs mobile-btn" style="pointer-events: auto; cursor: pointer;">
                        Reset View
                    </button>
                    <button id="rotate-btn" class="petal-btn text-white px-3 md:px-4 py-1.5 rounded-lg text-xs mobile-btn" style="pointer-events: auto; cursor: pointer;">
                        Auto Rotate
                    </button>
                    <button id="butterfly-btn" class="petal-btn text-white px-3 md:px-4 py-1.5 rounded-lg text-xs mobile-btn" style="pointer-events: auto; cursor: pointer;">
                        🦋 Butterflies
                    </button>
                    <button id="music-btn" class="petal-btn text-white px-3 md:px-4 py-1.5 rounded-lg text-xs mobile-btn" style="pointer-events: auto; cursor: pointer;">
                        🔇 Music
                    </button>
                </div>
            </div>

            <div class="glass-panel rounded-xl p-3 md:p-4 interactive text-center md:text-right w-full md:w-auto mobile-panel">
                <p class="rose-text text-lg md:text-xl text-red-300">Click any flower</p>
                <p class="body-text text-red-200/60 text-xs mt-1">to say sorry</p>
                <p class="body-text text-red-200/40 text-xs mt-1">Drag to orbit • Pinch to zoom</p>
            </div>
        </div>
    </div>

    <script>
        // ==================== THREE.JS SETUP ====================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0202, 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 5;
        controls.maxDistance = 40;
        controls.target.set(0, 1, 0);
        controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_PAN
        };

        // ==================== LIGHTING ====================
        const ambientLight = new THREE.AmbientLight(0xffcccc, 0.4);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0xffdddd, 0.8);
        moonLight.position.set(10, 20, 10);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 2048;
        moonLight.shadow.mapSize.height = 2048;
        scene.add(moonLight);

        const fillLight = new THREE.DirectionalLight(0xff4444, 0.3);
        fillLight.position.set(-10, 5, -10);
        scene.add(fillLight);

        const glowLights = [];
        for (let i = 0; i < 5; i++) {
            const light = new THREE.PointLight(0xff2222, 0.5, 15);
            light.position.set(
                (Math.random() - 0.5) * 20,
                2 + Math.random() * 3,
                (Math.random() - 0.5) * 20
            );
            scene.add(light);
            glowLights.push(light);
        }

        // ==================== GROUND ====================
        const groundGeometry = new THREE.PlaneGeometry(100, 100, 64, 64);
        const posAttribute = groundGeometry.attributes.position;
        for (let i = 0; i < posAttribute.count; i++) {
            const x = posAttribute.getX(i);
            const y = posAttribute.getY(i);
            const z = Math.sin(x * 0.1) * Math.cos(y * 0.1) * 0.5 + Math.random() * 0.1;
            posAttribute.setZ(i, z);
        }
        groundGeometry.computeVertexNormals();

        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a3a1a,
            roughness: 0.9,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grass patches
        const grassGeo = new THREE.ConeGeometry(0.05, 0.3, 3);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x2d5a2d });
        const grassInstanced = new THREE.InstancedMesh(grassGeo, grassMat, 3000);
        const dummy = new THREE.Object3D();
        for (let i = 0; i < 3000; i++) {
            dummy.position.set(
                (Math.random() - 0.5) * 50,
                0.15,
                (Math.random() - 0.5) * 50
            );
            dummy.rotation.y = Math.random() * Math.PI;
            dummy.scale.setScalar(0.5 + Math.random() * 1.5);
            dummy.updateMatrix();
            grassInstanced.setMatrixAt(i, dummy.matrix);
        }
        grassInstanced.receiveShadow = true;
        scene.add(grassInstanced);

        // ==================== FLOWER GENERATOR ====================
        const flowers = [];

        function createPetalShape() {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.bezierCurveTo(0.3, 0.1, 0.5, 0.5, 0.3, 1);
            shape.bezierCurveTo(0.1, 1.3, -0.1, 1.3, -0.3, 1);
            shape.bezierCurveTo(-0.5, 0.5, -0.3, 0.1, 0, 0);
            return shape;
        }

        function createRose(x, z, scale = 1) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            group.scale.setScalar(scale);
            
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0.05, 0.5, 0),
                new THREE.Vector3(-0.02, 1.2, 0.03),
                new THREE.Vector3(0, 2, 0)
            ]);
            const stemGeo = new THREE.TubeGeometry(stemCurve, 20, 0.04, 8, false);
            const stemMat = new THREE.MeshStandardMaterial({ 
                color: 0x2d5a2d, 
                roughness: 0.7 
            });
            const stem = new THREE.Mesh(stemGeo, stemMat);
            stem.castShadow = true;
            group.add(stem);

            for (let i = 0; i < 4; i++) {
                const thornGeo = new THREE.ConeGeometry(0.02, 0.08, 4);
                const thorn = new THREE.Mesh(thornGeo, stemMat);
                const t = 0.3 + i * 0.15;
                const point = stemCurve.getPoint(t);
                thorn.position.copy(point);
                thorn.rotation.z = (i % 2 === 0 ? 1 : -1) * Math.PI / 4;
                group.add(thorn);
            }

            const leafShape = new THREE.Shape();
            leafShape.moveTo(0, 0);
            leafShape.quadraticCurveTo(0.3, 0.2, 0.5, 0);
            leafShape.quadraticCurveTo(0.3, -0.2, 0, 0);
            const leafGeo = new THREE.ExtrudeGeometry(leafShape, { depth: 0.01, bevelEnabled: false });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x3a7a3a, side: THREE.DoubleSide });

            for (let i = 0; i < 3; i++) {
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                const t = 0.4 + i * 0.2;
                const point = stemCurve.getPoint(t);
                leaf.position.copy(point);
                leaf.rotation.set(
                    Math.random() * 0.5,
                    (i * Math.PI * 2 / 3),
                    Math.PI / 4
                );
                leaf.scale.setScalar(1.5);
                group.add(leaf);
            }

            const petalShape = createPetalShape();
            const petalGeo = new THREE.ExtrudeGeometry(petalShape, { 
                depth: 0.02, 
                bevelEnabled: true, 
                bevelThickness: 0.01, 
                bevelSize: 0.01 
            });

            const roseColors = [
                0xdc143c, 0xb22222, 0x8b0000, 0xff1744, 
                0xc71585, 0xff0066, 0x990033
            ];
            const roseColor = roseColors[Math.floor(Math.random() * roseColors.length)];

            const petalMat = new THREE.MeshStandardMaterial({
                color: roseColor,
                roughness: 0.4,
                metalness: 0.1,
                emissive: roseColor,
                emissiveIntensity: 0.1
            });

            const headGroup = new THREE.Group();
            headGroup.position.set(0, 2, 0);

            for (let i = 0; i < 5; i++) {
                const petal = new THREE.Mesh(petalGeo, petalMat);
                petal.rotation.set(-Math.PI / 6, (i / 5) * Math.PI * 2, Math.PI / 8);
                petal.scale.set(0.6, 0.6, 0.6);
                headGroup.add(petal);
            }
            for (let i = 0; i < 7; i++) {
                const petal = new THREE.Mesh(petalGeo, petalMat);
                petal.rotation.set(-Math.PI / 4, (i / 7) * Math.PI * 2 + 0.3, Math.PI / 6);
                petal.scale.set(0.85, 0.85, 0.85);
                headGroup.add(petal);
            }
            for (let i = 0; i < 9; i++) {
                const petal = new THREE.Mesh(petalGeo, petalMat);
                petal.rotation.set(-Math.PI / 3, (i / 9) * Math.PI * 2 + 0.6, Math.PI / 4);
                petal.scale.set(1.1, 1.1, 1.1);
                headGroup.add(petal);
            }

            group.add(headGroup);

            group.userData = {
                head: headGroup,
                baseY: 0,
                swaySpeed: 0.5 + Math.random() * 1,
                swayOffset: Math.random() * Math.PI * 2,
                originalScale: scale,
                hovered: false,
                type: 'rose'
            };

            scene.add(group);
            flowers.push(group);
            return group;
        }

        function createTulip(x, z, scale = 1) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            group.scale.setScalar(scale);

            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0.02, 0.8, 0),
                new THREE.Vector3(-0.01, 1.6, 0.01),
                new THREE.Vector3(0, 2.5, 0)
            ]);
            const stemGeo = new THREE.TubeGeometry(stemCurve, 20, 0.035, 8, false);
            const stemMat = new THREE.MeshStandardMaterial({ 
                color: 0x2d5a2d, 
                roughness: 0.7 
            });
            const stem = new THREE.Mesh(stemGeo, stemMat);
            stem.castShadow = true;
            group.add(stem);

            const leafShape = new THREE.Shape();
            leafShape.moveTo(0, 0);
            leafShape.quadraticCurveTo(0.4, 0.3, 0.7, 0.1);
            leafShape.quadraticCurveTo(0.5, -0.1, 0.2, -0.05);
            leafShape.quadraticCurveTo(0, -0.1, 0, 0);
            const leafGeo = new THREE.ExtrudeGeometry(leafShape, { depth: 0.01, bevelEnabled: false });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x3a7a3a, side: THREE.DoubleSide });

            for (let i = 0; i < 2; i++) {
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                const t = 0.3 + i * 0.3;
                const point = stemCurve.getPoint(t);
                leaf.position.copy(point);
                leaf.rotation.set(Math.PI / 3, (i * Math.PI), Math.PI / 6);
                leaf.scale.setScalar(2);
                group.add(leaf);
            }

            const tulipColors = [
                0xff6b9d, 0xff8fab, 0xc44569, 0xf8b500, 
                0xffa502, 0xe15f41, 0xff9ff3
            ];
            const tulipColor = tulipColors[Math.floor(Math.random() * tulipColors.length)];

            const cupMat = new THREE.MeshStandardMaterial({
                color: tulipColor,
                roughness: 0.35,
                metalness: 0.05,
                emissive: tulipColor,
                emissiveIntensity: 0.08,
                side: THREE.DoubleSide
            });

            const headGroup = new THREE.Group();
            headGroup.position.set(0, 2.5, 0);

            for (let i = 0; i < 6; i++) {
                const petalShape = new THREE.Shape();
                petalShape.moveTo(0, 0);
                petalShape.bezierCurveTo(0.25, 0.3, 0.35, 0.7, 0.2, 1.2);
                petalShape.bezierCurveTo(0.1, 1.4, -0.1, 1.4, -0.2, 1.2);
                petalShape.bezierCurveTo(-0.35, 0.7, -0.25, 0.3, 0, 0);

                const petalGeo = new THREE.ExtrudeGeometry(petalShape, { 
                    depth: 0.015, 
                    bevelEnabled: true, 
                    bevelThickness: 0.008, 
                    bevelSize: 0.008 
                });

                const petal = new THREE.Mesh(petalGeo, cupMat);
                const angle = (i / 6) * Math.PI * 2;
                petal.rotation.y = angle;
                petal.rotation.x = -Math.PI / 8;
                petal.scale.set(0.9, 0.9, 0.9);
                headGroup.add(petal);
            }

            for (let i = 0; i < 6; i++) {
                const petalShape = new THREE.Shape();
                petalShape.moveTo(0, 0);
                petalShape.bezierCurveTo(0.2, 0.25, 0.3, 0.6, 0.15, 1.0);
                petalShape.bezierCurveTo(0.08, 1.2, -0.08, 1.2, -0.15, 1.0);
                petalShape.bezierCurveTo(-0.3, 0.6, -0.2, 0.25, 0, 0);

                const petalGeo = new THREE.ExtrudeGeometry(petalShape, { 
                    depth: 0.012, 
                    bevelEnabled: true, 
                    bevelThickness: 0.006, 
                    bevelSize: 0.006 
                });

                const petal = new THREE.Mesh(petalGeo, cupMat);
                const angle = (i / 6) * Math.PI * 2 + Math.PI / 6;
                petal.rotation.y = angle;
                petal.rotation.x = -Math.PI / 10;
                petal.scale.set(0.7, 0.7, 0.7);
                headGroup.add(petal);
            }

            group.add(headGroup);

            group.userData = {
                head: headGroup,
                baseY: 0,
                swaySpeed: 0.4 + Math.random() * 0.8,
                swayOffset: Math.random() * Math.PI * 2,
                originalScale: scale,
                hovered: false,
                type: 'tulip'
            };

            scene.add(group);
            flowers.push(group);
            return group;
        }

        // ==================== GARDEN LAYOUT ====================
        const heartPositions = [];
        for (let t = 0; t < Math.PI * 2; t += 0.15) {
            const x = 16 * Math.pow(Math.sin(t), 3) * 0.15;
            const z = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.15;
            heartPositions.push({ x, z });
        }

        heartPositions.forEach((pos) => {
            createRose(pos.x * 1.5, pos.z * 1.5, 0.8 + Math.random() * 0.4);
        });

        for (let i = 0; i < 15; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 3 + Math.random() * 12;
            createRose(Math.cos(angle) * radius, Math.sin(angle) * radius, 0.7 + Math.random() * 0.5);
        }

        for (let i = 0; i < 20; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 2 + Math.random() * 14;
            createTulip(Math.cos(angle) * radius, Math.sin(angle) * radius, 0.8 + Math.random() * 0.4);
        }

        // ==================== PARTICLES (FIREFLIES) ====================
        const particleCount = 200;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleVelocities = [];

        for (let i = 0; i < particleCount; i++) {
            particlePositions[i * 3] = (Math.random() - 0.5) * 40;
            particlePositions[i * 3 + 1] = 0.5 + Math.random() * 8;
            particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 40;
            particleVelocities.push({
                x: (Math.random() - 0.5) * 0.02,
                y: (Math.random() - 0.5) * 0.01,
                z: (Math.random() - 0.5) * 0.02
            });
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0xffdd44,
            size: 0.15,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // ==================== BUTTERFLIES ====================
        const butterflies = [];

        function createButterfly() {
            const group = new THREE.Group();

            const wingShape = new THREE.Shape();
            wingShape.moveTo(0, 0);
            wingShape.bezierCurveTo(0.3, 0.4, 0.5, 0.2, 0.4, 0);
            wingShape.bezierCurveTo(0.3, -0.2, 0.1, -0.1, 0, 0);

            const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.01, bevelEnabled: false });
            const wingMat = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(Math.random(), 0.8, 0.6),
                emissive: new THREE.Color().setHSL(Math.random(), 0.5, 0.2),
                emissiveIntensity: 0.3,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.9
            });

            const leftWing = new THREE.Mesh(wingGeo, wingMat);
            leftWing.scale.set(0.5, 0.5, 0.5);
            leftWing.rotation.y = Math.PI;

            const rightWing = new THREE.Mesh(wingGeo, wingMat);
            rightWing.scale.set(0.5, 0.5, 0.5);

            group.add(leftWing);
            group.add(rightWing);

            group.position.set(
                (Math.random() - 0.5) * 20,
                2 + Math.random() * 4,
                (Math.random() - 0.5) * 20
            );

            group.userData = {
                leftWing, rightWing,
                speed: 0.02 + Math.random() * 0.03,
                radius: 2 + Math.random() * 5,
                angle: Math.random() * Math.PI * 2,
                yOffset: Math.random() * Math.PI * 2,
                wingSpeed: 8 + Math.random() * 5
            };

            scene.add(group);
            butterflies.push(group);
        }

        // ==================== INTERACTION ====================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredFlower = null;
        let autoRotate = false;
        let touchedFlower = null;

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(flowers, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && !obj.userData.type) {
                    obj = obj.parent;
                }
                if (obj.userData && obj.userData.type) {
                    showMessage();

                    const originalY = obj.position.y;
                    let bounceTime = 0;
                    const bounce = () => {
                        bounceTime += 0.05;
                        obj.position.y = originalY + Math.sin(bounceTime * 10) * 0.3 * Math.exp(-bounceTime * 3);
                        if (bounceTime < 2) requestAnimationFrame(bounce);
                        else obj.position.y = originalY;
                    };
                    bounce();
                }
            }
        }

        function onTouchStart(event) {
            if (event.touches.length === 1) {
                const touch = event.touches[0];
                mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(flowers, true);

                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj.parent && !obj.userData.type) {
                        obj = obj.parent;
                    }
                    if (obj.userData && obj.userData.type) {
                        touchedFlower = obj;
                        obj.userData.hovered = true;
                        const targetScale = obj.userData.originalScale * 1.15;
                        obj.scale.setScalar(targetScale);
                    }
                }
            }
        }

        function onTouchEnd(event) {
            if (touchedFlower) {
                const orig = touchedFlower.userData.originalScale;
                touchedFlower.scale.setScalar(orig);
                touchedFlower.userData.hovered = false;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(flowers, true);
                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj.parent && !obj.userData.type) {
                        obj = obj.parent;
                    }
                    if (obj === touchedFlower) {
                        showMessage();

                        const originalY = obj.position.y;
                        let bounceTime = 0;
                        const bounce = () => {
                            bounceTime += 0.05;
                            obj.position.y = originalY + Math.sin(bounceTime * 10) * 0.3 * Math.exp(-bounceTime * 3);
                            if (bounceTime < 2) requestAnimationFrame(bounce);
                            else obj.position.y = originalY;
                        };
                        bounce();
                    }
                }
                touchedFlower = null;
            }
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('click', onClick);
        window.addEventListener('touchstart', onTouchStart, { passive: false });
        window.addEventListener('touchend', onTouchEnd, { passive: false });
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==================== UI FUNCTIONS ====================
        const messagePanel = document.getElementById('message-panel');
        const closeBtn = document.getElementById('close-btn');
        const resetBtn = document.getElementById('reset-btn');
        const rotateBtn = document.getElementById('rotate-btn');
        const butterflyBtn = document.getElementById('butterfly-btn');

        function showMessage() {
            messagePanel.classList.remove('hidden');
        }

        function closeMessage() {
            messagePanel.classList.add('hidden');
        }

        function resetCamera() {
            camera.position.set(0, 8, 18);
            controls.target.set(0, 1, 0);
            controls.update();
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 2;
        }

        function addButterflies() {
            for (let i = 0; i < 5; i++) createButterfly();
        }

        closeBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            e.preventDefault();
            closeMessage();
        });

        closeBtn.addEventListener('touchend', function(e) {
            e.stopPropagation();
            e.preventDefault();
            closeMessage();
        });

        resetBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            resetCamera();
        });

        resetBtn.addEventListener('touchend', function(e) {
            e.stopPropagation();
            e.preventDefault();
            resetCamera();
        });

        rotateBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleAutoRotate();
        });

        rotateBtn.addEventListener('touchend', function(e) {
            e.stopPropagation();
            e.preventDefault();
            toggleAutoRotate();
        });

        butterflyBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            addButterflies();
        });

        butterflyBtn.addEventListener('touchend', function(e) {
            e.stopPropagation();
            e.preventDefault();
            addButterflies();
        });

        messagePanel.addEventListener('click', function(e) {
            if (e.target === messagePanel) {
                closeMessage();
            }
        });

        // ==================== ANIMATION LOOP ====================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            flowers.forEach(flower => {
                const data = flower.userData;
                const sway = Math.sin(time * data.swaySpeed + data.swayOffset) * 0.05;
                flower.rotation.z = sway;
                flower.rotation.x = sway * 0.5;

                if (data.hovered) {
                    data.head.rotation.y += 0.02;
                } else {
                    data.head.rotation.y = Math.sin(time * 0.5 + data.swayOffset) * 0.1;
                }
            });

            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] += particleVelocities[i].x + Math.sin(time + i) * 0.01;
                positions[i * 3 + 1] += particleVelocities[i].y + Math.cos(time * 0.7 + i) * 0.005;
                positions[i * 3 + 2] += particleVelocities[i].z + Math.sin(time * 0.5 + i) * 0.01;

                if (positions[i * 3 + 1] > 10) positions[i * 3 + 1] = 0.5;
                if (positions[i * 3 + 1] < 0.3) positions[i * 3 + 1] = 8;
                if (Math.abs(positions[i * 3]) > 25) positions[i * 3] *= -0.9;
                if (Math.abs(positions[i * 3 + 2]) > 25) positions[i * 3 + 2] *= -0.9;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            butterflies.forEach((bf, i) => {
                const data = bf.userData;
                data.angle += data.speed;
                bf.position.x = Math.cos(data.angle) * data.radius;
                bf.position.z = Math.sin(data.angle) * data.radius;
                bf.position.y = 2.5 + Math.sin(time + data.yOffset) * 1.5;
                bf.rotation.y = -data.angle + Math.PI / 2;

                const flap = Math.sin(time * data.wingSpeed) * 0.5;
                data.leftWing.rotation.z = flap;
                data.rightWing.rotation.z = -flap;
            });

            glowLights.forEach((light, i) => {
                light.intensity = 0.3 + Math.sin(time * 2 + i) * 0.2;
                light.position.y = 2 + Math.sin(time * 0.5 + i) * 1;
            });

            if (window.innerWidth > 768) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(flowers, true);

                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj.parent && !obj.userData.type) {
                        obj = obj.parent;
                    }
                    if (obj.userData) {
                        if (hoveredFlower !== obj) {
                            if (hoveredFlower) {
                                hoveredFlower.userData.hovered = false;
                                hoveredFlower.scale.setScalar(hoveredFlower.userData.originalScale);
                            }
                            hoveredFlower = obj;
                            hoveredFlower.userData.hovered = true;
                        }
                        const targetScale = obj.userData.originalScale * 1.1;
                        obj.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
                        document.body.style.cursor = 'pointer';
                    }
                } else {
                    if (hoveredFlower) {
                        hoveredFlower.userData.hovered = false;
                        const orig = hoveredFlower.userData.originalScale;
                        hoveredFlower.scale.lerp(new THREE.Vector3(orig, orig, orig), 0.1);
                        if (Math.abs(hoveredFlower.scale.x - orig) < 0.01) hoveredFlower = null;
                    }
                    document.body.style.cursor = 'default';
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        addButterflies();

        // ==================== BACKGROUND MUSIC ====================
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.6;

        const loadingScreen = document.getElementById('loading');
        const tapHint = document.getElementById('tap-hint');

        // Show "tap to enter" hint after 1.5s
        setTimeout(() => { tapHint.style.opacity = '1'; }, 1500);

        function enterSite() {
            // This runs inside a real user gesture — audio will always play
            bgMusic.play().catch(() => {});

            loadingScreen.style.opacity = '0';
            setTimeout(() => { loadingScreen.style.display = 'none'; }, 1000);

            loadingScreen.removeEventListener('click', enterSite);
            loadingScreen.removeEventListener('touchstart', enterSite);
        }

        loadingScreen.addEventListener('click', enterSite);
        loadingScreen.addEventListener('touchstart', enterSite);

        animate();
    </script>
</body>
</html>
